[build-system]
# The same exact nanobind pin as pantr's pyproject.toml: _pantr_mpi and _pantr exchange only a
# capsule of a versioned C struct, but every pantr extension module builds against one pin
# (bindings/mpi/CMakeLists.txt refuses another). mpi4py 4.0 is the first with a C API usable under
# the stable ABI (MPI4PY_LIMITED_API). pantr at the same version supplies the headers and CMake
# package a build from this sdist uses (`find_package(pantr COMPONENTS mpi-capsule)`, found in the
# build environment's site-packages); a build from pantr's source tree uses the tree's headers.
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0", "mpi4py>=4.0,<5", "pantr==0.7.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pantr-mpi"
description = "The MPI glue of pantr's pantr.mpi (install with pip install \"pantr[mpi]\")"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = "MIT"
# Copies of pantr's LICENSE and of the licences of the nanobind code compiled into _pantr_mpi
# (tools/check_dependencies.py keeps them identical to the originals).
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "Pablo Antolin", email = "pablo.antolin@epfl.ch" }]
dynamic = ["version"]
# The MPI library itself is not bundled: install one (a system MPI, or the mpich / openmpi wheels)
# of the family the wheel was built for. pantr.mpi checks it before loading the extension.
dependencies = ["mpi4py>=4.0,<5"]

[tool.scikit-build]
minimum-version = "build-system.requires"
# One version for pantr and pantr-mpi: read from pantr's __init__ in this source tree.
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "../../src/pantr/__init__.py"
metadata.version.regex = '^__version__[^=]*=\s*"(?P<value>[^"]+)"'
wheel.py-api = "cp312"
wheel.packages = []
install.components = ["mpi"]
install.strip = false
build-dir = "../../build/skbuild-mpi/{wheel_tag}"

# An sdist holds bindings/mpi alone, with no pantr tree two levels up: read the version the sdist
# recorded in its PKG-INFO, build in a temporary directory, and take pantr's headers from the
# installed pantr (an empty PANTR_INCLUDE_DIR makes CMakeLists.txt use find_package).
[[tool.scikit-build.overrides]]
if.from-sdist = true
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "PKG-INFO"
metadata.version.regex = '^Version:\s*(?P<value>\S+)'
build-dir = ""
cmake.define.PANTR_INCLUDE_DIR = ""

[tool.scikit-build.cmake]
build-type = "Release"
version = ">=3.28"

[tool.scikit-build.cmake.define]
PANTR_STABLE_ABI = "ON"
