# CI for pantr: the Python suite over the compiled extension, the C++ library, and the wheels.
#
# The legs follow design/port_design.md, section 8.2 (numbered there 1 to 12, plus the MSVC leg,
# 13 here; the BeRF-FR provider leg lands with that provider). Every push of the port branch runs
# all of them, nothing reduced.
#
# The extension is built once where legs can share it: `build-ext` compiles the stable-ABI
# (cp312-abi3) modules on Python 3.12, and the tests, docs and no-MPI legs download them into
# src/pantr. The same binary then runs under 3.12, 3.13 and 3.14, so the stable-ABI claim is
# tested rather than assumed. No job installs pantr editable: a source install compiles the
# extension, so jobs install their tools from pyproject.toml with tools/requirements.py and build
# with `make ext` where they need to.

name: CI

on:
  push:
    branches: [main, feat/cpp-port]
  pull_request:
    branches: [main]

# A second push cancels the first run's jobs, and a cancelled job reads as a failure in
# `gh pr checks`: confirm a job was cancelled before reacting to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The compiler of the Linux C++ legs and extension builds (the manylinux wheel builds use their
  # container's, wheels.yaml). GCC 14 is the first GCC whose -ffp-contract=on contracts within
  # expressions (design section 1.3).
  CC: gcc-14
  CXX: g++-14
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Fetched third-party sources (pinned by SHA), shared by every job that builds C++.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/build/_deps

jobs:
  # --- 1 ------------------------------------------------------------------------------------------
  lint:
    name: "1 lint (ruff, ruff format, clang-format, dependencies)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the linters
        run: python -m pip install $(python tools/requirements.py dev | grep -E '^(ruff|clang-format)[<>=]')
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting check
        run: ruff format --check .
      - name: No numba or threadpoolctl; scipy only in its boundary modules
        run: python tools/check_dependencies.py
      - name: clang-format check
        run: |
          git ls-files -- 'include/*.h' 'include/*.hpp' 'cpp/*.h' 'cpp/*.hpp' 'cpp/*.cpp' \
            'bindings/*.h' 'bindings/*.hpp' 'bindings/*.cpp' 'providers/*.h' 'providers/*.hpp' \
            'providers/*.cpp' \
            | xargs clang-format --dry-run --Werror
      - name: The C ABI header compiles as C
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -x c include/pantr/mpi/comm_capsule.h

  # --- 2 ------------------------------------------------------------------------------------------
  type-check:
    name: "2 type-check (mypy, py${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy reads the committed extension stubs, so nothing is built here.
      - name: Install the dependencies
        run: |
          python tools/requirements.py dev > requirements.txt
          python -m pip install -r requirements.txt
      - name: Type check
        run: make type-check

  # --- 3: the extension, built once ------------------------------------------------------------
  build-ext:
    name: "3 build the extension (abi3, every rung) and check its stubs"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the build and runtime dependencies
        run: |
          python tools/requirements.py build > requirements.txt
          python tools/requirements.py dev | grep '^ruff' >> requirements.txt
          python -m pip install -r requirements.txt "cmake>=3.28" ninja
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      - name: Build, warnings as errors
        run: make ext EXT_CMAKE_ARGS="-DPANTR_WARNINGS_AS_ERRORS=ON"
      - name: The committed stubs match the build
        run: make stubs-check
      - name: No module is compiled for size or stripped
        run: |
          if ninja -C build/dev -t commands | grep -E -- '(^| )-Os( |$)|-Wl,-s( |$)'; then exit 1; fi
          file src/pantr/_pantr*.so
          if file src/pantr/_pantr*.so | grep -v 'not stripped'; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ext-linux-abi3
          path: src/pantr/_pantr*.so
          if-no-files-found: error

  # --- 3: one binary, three interpreters --------------------------------------------------------
  tests:
    name: "3 tests, doctests, coverage (py${{ matrix.python-version }})"
    needs: [build-ext]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OpenMPI (mpi4py, in the dev extra, builds against it)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install the dependencies
        run: |
          python tools/requirements.py dev > requirements.txt
          python -m pip install -r requirements.txt
      # Downloaded after the checkout, so the modules are newer than every source and the test
      # session's staleness check passes.
      - uses: actions/download-artifact@v8
        with:
          name: ext-linux-abi3
          path: src/pantr
      - name: Import boundaries (import-linter, against this tree)
        run: make import-lint
      - name: Tests
        run: make test PYTEST_WORKERS=auto
      - name: Doctests
        run: make doctest
      - name: Coverage
        run: make coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}-run${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error

  # --- 4 ------------------------------------------------------------------------------------------
  docs:
    name: "4 docs (Sphinx -W)"
    needs: [build-ext]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the docs dependencies
        run: |
          python tools/requirements.py docs > requirements.txt
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: ext-linux-abi3
          path: src/pantr
      - name: Build the docs
        run: make docs SPHINXOPTS="-W --keep-going -j auto"

  # --- 5 ------------------------------------------------------------------------------------------
  cpp:
    name: "5 cpp (${{ matrix.compiler }}, ${{ matrix.isa }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-14, clang-18]
        isa: [baseline, x86-64-v3, scalar]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - name: Configure, build and test (Release, warnings as errors, no native ISA)
        run: |
          case "${{ matrix.compiler }}" in
            gcc-14) preset=gcc-release; cxx=g++-14 ;;
            clang-18) preset=clang-release; cxx=clang++-18 ;;
          esac
          # PANTR_TEST_EXPECT_ISA, read by test_simd.cpp at run time, pins the SIMD level each leg
          # must reach, so a build that lost its -march would fail rather than run scalar.
          case "${{ matrix.isa }}" in
            baseline) extra=(); expect=scalar ;;
            x86-64-v3) extra=(-DCMAKE_CXX_FLAGS=-march=x86-64-v3); expect=avx2 ;;
            scalar) extra=(-DPANTR_FORCE_SCALAR=ON); expect=scalar ;;
          esac
          cmake --preset "$preset" -DCMAKE_CXX_COMPILER="$cxx" "${extra[@]}"
          cmake --build --preset "$preset"
          PANTR_TEST_EXPECT_ISA="$expect" ctest --preset "$preset"

  # --- 6 ------------------------------------------------------------------------------------------
  cpp-asan-ubsan:
    name: "6 cpp-asan-ubsan (clang-18)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      # The preset sets -fno-sanitize-recover=undefined: without it UBSan reports and exits 0.
      - name: Configure, build and test
        run: |
          cmake --preset clang-asan-ubsan -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset clang-asan-ubsan
          ctest --preset clang-asan-ubsan

  # --- 7 ------------------------------------------------------------------------------------------
  cpp-tsan:
    name: "7 cpp-tsan (gcc-14)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      # A runner kernel that randomizes mmap more than the TSan runtime accepts stops it at start;
      # this lowers the randomization for the job (a runner setting, not a test setting).
      - name: Let TSan map its shadow memory
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure, build and test
        run: |
          cmake --preset gcc-tsan -DCMAKE_CXX_COMPILER=g++-14
          cmake --build --preset gcc-tsan
          ctest --preset gcc-tsan

  # --- 8 ------------------------------------------------------------------------------------------
  install-consumer:
    name: "8 install-consumer (find_package with the mpi component, poisoned mpi.h, METIS provider, C++ MPI tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      - name: Install Ninja, an MPI (the consumer asks for the mpi component) and METIS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build libopenmpi-dev openmpi-bin libmetis-dev
      # The install tests put pantr in a fresh prefix and build cpp/tests/consumer against it with
      # every package-search shortcut off; the header tests compile each core header with a
      # poisoned mpi.h first on the include path; the METIS provider (PANTR_WITH_METIS, off by
      # default) is built and its tests run here, in the build tree, against the distribution's
      # METIS (the consumer project does not ask for the metis component); and the C++ MPI tests
      # (mpi.communicator_np2 and _np3) run under this runner's mpiexec, beside the fake-communicator
      # suites.
      - name: Configure, build and run the install, header and METIS tests
        run: |
          cmake --preset gcc-release -DCMAKE_CXX_COMPILER=g++-14 -DPANTR_WITH_METIS=ON
          cmake --build --preset gcc-release
          ctest --preset gcc-release -R "install|header|notices|metis|mpi" --no-tests=error

  # --- 9 ------------------------------------------------------------------------------------------
  mpi:
    name: "9 mpi (OpenMPI, mpiexec -n 2 and 3)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PANTR_RUN_MPI: "1"
      # mpi4py built against the runner's MPI, so launcher and library agree.
      PIP_NO_BINARY: mpi4py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OpenMPI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install the dependencies
        run: |
          python tools/requirements.py dev build > requirements.txt
          python -m pip install -r requirements.txt "cmake>=3.28" ninja
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      # Built here rather than downloaded: the MPI extension (_pantr_mpi, package pantr_mpi) is built
      # from source against this runner's MPI and mpi4py, in this leg (make ext builds it wherever
      # it finds both).
      - name: Build the extension and the MPI module
        run: make ext EXT_MULTI_ISA=OFF
      - name: The MPI module is built, for Open MPI
        run: |
          PYTHONPATH="$PWD/src" python -c "import pantr_mpi._build_info as b; assert b.FAMILY == 'openmpi', b.FAMILY; print(b.BUILT_AGAINST)"
          PYTHONPATH="$PWD/src" python -c "import pantr_mpi._pantr_mpi as m; assert m.compiled_implementation == 'openmpi'"
      - name: mpi4py matches the launcher
        run: mpiexec --oversubscribe -n 2 python -c "from mpi4py import MPI; assert MPI.COMM_WORLD.size == 2"
      - name: MPI tests, 2 ranks
        run: mpiexec --oversubscribe -n 2 python -m pytest tests/mpi/ -p no:cacheprovider
      - name: MPI tests, 3 ranks
        run: mpiexec --oversubscribe -n 3 python -m pytest tests/mpi/ -p no:cacheprovider

  # --- 10 -----------------------------------------------------------------------------------------
  sweep:
    name: "10 sweep (sanitized extension, slow tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PANTR_RUN_SWEEP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OpenMPI (mpi4py, in the dev extra, builds against it)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install the dependencies
        run: |
          python tools/requirements.py dev build > requirements.txt
          python -m pip install -r requirements.txt "cmake>=3.28" ninja
      - uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/PantrDependencies.cmake') }}
      # ASan, UBSan without recovery, and libstdc++'s assertions in every module. The interpreter
      # is not sanitized, so the runtimes are preloaded and leak detection is off (CPython's own
      # allocations alive at exit would be reported).
      - name: Build the sanitized extension
        run: >-
          make ext EXT_BUILD_DIR=build/sweep EXT_MULTI_ISA=OFF
          EXT_CMAKE_ARGS="-DCMAKE_BUILD_TYPE=RelWithDebInfo
          '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS'
          -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined"
      # The sweep's verdict on an out-of-range access is the sanitizer's abort, so a module built
      # without the instrumentation would pass clean while detecting nothing.
      - name: The extension is instrumented
        run: |
          for so in src/pantr/_pantr*.so; do
            nm -D --undefined-only "$so" | grep -q __asan_report || { echo "$so: no ASan"; exit 1; }
          done
      - name: Adversarial sweep and slow tests, under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          export LD_PRELOAD="$(g++-14 -print-file-name=libasan.so):$(g++-14 -print-file-name=libubsan.so)"
          python -m pytest tests/test_adversarial_sweep.py -v -p no:cacheprovider
          python -m pytest -m slow -n 4 -p no:cacheprovider

  # --- 11 -----------------------------------------------------------------------------------------
  # The wheels and sdists of pantr and pantr-mpi, the very artifacts release.yaml publishes.
  wheels:
    name: "11 wheels"
    uses: ./.github/workflows/wheels.yaml

  # --- 12 -----------------------------------------------------------------------------------------
  no-mpi:
    name: "12 no-mpi (no MPI library, no mpi4py)"
    needs: [build-ext]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the runtime and test dependencies only
        run: |
          python tools/requirements.py > requirements.txt
          python tools/requirements.py dev | grep -E '^pytest(-xdist)?[<>=]' >> requirements.txt
          python -m pip install -r requirements.txt
          if python -c "import mpi4py"; then exit 1; fi
      - uses: actions/download-artifact@v8
        with:
          name: ext-linux-abi3
          path: src/pantr
      - name: pantr and pantr.mpi import without MPI
        run: PYTHONPATH="$PWD/src" python -c "import pantr, pantr.mpi"
      - name: The fake-communicator tests
        run: >-
          python -m pytest -n 4 -p no:cacheprovider tests/test_mpi*.py
          tests/test_distributed_space.py tests/test_from_dolfinx.py

  # --- 13 -----------------------------------------------------------------------------------------
  msvc:
    name: "13 msvc (C++ suite; the extension's loading tests)"
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install the dependencies
        shell: bash
        run: |
          python tools/requirements.py build > requirements.txt
          python tools/requirements.py dev | grep -E '^pytest[<>=]' >> requirements.txt
          python -m pip install -r requirements.txt "cmake>=3.28" ninja
      - name: C++ suite (MSVC, Release, warnings as errors)
        shell: bash
        run: |
          cmake -S . -B build/msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl \
            -DPANTR_NATIVE_ARCH=OFF -DPANTR_WARNINGS_AS_ERRORS=ON
          cmake --build build/msvc
          ctest --test-dir build/msvc --output-on-failure
      - name: The extension, every rung, installed into src/pantr
        shell: bash
        run: |
          cmake -S . -B build/msvc-ext -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DPANTR_BUILD_PYTHON=ON -DPANTR_BUILD_TESTS=OFF -DPANTR_INSTALL=OFF \
            -DPANTR_NATIVE_ARCH=OFF -DPANTR_MULTI_ISA=ON -DPANTR_BUILD_PYTHON_TEST_MODULES=ON \
            -DPANTR_WARNINGS_AS_ERRORS=ON
          cmake --build build/msvc-ext
          cmake --install build/msvc-ext --component python --prefix src
          cmake --install build/msvc-ext --component testing --prefix src
      - name: Loading, ISA ladder, CPU probe, shared pool, thread settings
        shell: bash
        run: python -m pytest -p no:cacheprovider tests/test_ext.py tests/test_shared_parallelism.py tests/test_parallel.py
