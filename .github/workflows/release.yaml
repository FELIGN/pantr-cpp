name: Release

# Release automation for PaNTr.
#
# Triggers:
#   * Pushing a `v*` tag  -> build and test the wheels and sdists of pantr and
#     pantr-mpi (wheels.yaml, the workflow CI runs), check them and write the Release
#     notes (`collect`, before anything is uploaded), publish to TestPyPI, then PyPI,
#     then cut a GitHub Release. This is the real release path.
#   * Manual `workflow_dispatch` -> build and publish to TestPyPI only. A safe
#     end-to-end rehearsal that never touches the real index.
#
# Publishing uses PyPA Trusted Publishing (OIDC): no API tokens are stored. The
# `testpypi` / `pypi` GitHub environments and matching "pending publishers" on
# test.pypi.org / pypi.org authorize the upload from this workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same reusable workflow ci.yaml runs as leg 11: cibuildwheel wheels for every platform,
  # each tested against the suite, and the sdists, for pantr and pantr-mpi.
  wheels:
    name: Build and test the distributions
    uses: ./.github/workflows/wheels.yaml

  collect:
    name: Collect and check the distributions
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download every wheel and sdist
        uses: actions/download-artifact@v8
        with:
          path: all
          merge-multiple: true

      - name: Split by distribution and check the metadata
        run: |
          set -euo pipefail
          mkdir -p dist-pantr dist-pantr-mpi
          mv all/pantr_mpi-* dist-pantr-mpi/
          mv all/pantr-* dist-pantr/
          ls -l dist-pantr dist-pantr-mpi
          test -z "$(ls -A all)" || { echo "::error::unexpected files: $(ls all)"; exit 1; }
          python -m pip install twine
          python -m twine check --strict dist-pantr/* dist-pantr-mpi/*

      - name: Verify the built versions match the tag
        # On a tag push what ships MUST carry the tagged version, so we check the built
        # artifacts rather than re-parsing the source. The rehearsal (workflow_dispatch) skips
        # this on purpose: it may build from an untagged branch and only ever reaches TestPyPI.
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for whl in dist-pantr/*.whl dist-pantr-mpi/*.whl; do
            version=$(basename "$whl" | cut -d- -f2)
            if [ "$TAG" != "v$version" ]; then
              echo "::error::Tag '$TAG' does not match $(basename "$whl") (version 'v$version')"
              exit 1
            fi
          done

      # The Release body is short on purpose: the version, a link to the changelog and the
      # attached files. A copy of the changelog section can exceed GitHub's limit on a release
      # body, and that would fail `github-release` after PyPI had the files. It is written here
      # so that a missing changelog section stops the run before any upload.
      - name: Write the GitHub Release notes
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The exact version header ("## 0.7.0 (date)"), not a prefix, so v0.7 / v0.7.0 /
          # v0.7.0-rc1 never collide.
          if ! grep -Eq "^## ${version//./\\.}( |$)" docs/changelog.md; then
            echo "::error::docs/changelog.md has no '## $version' section"
            exit 1
          fi
          {
            echo "pantr and pantr-mpi $version."
            echo
            echo "Changes: [section $version of the changelog]($REPO_URL/blob/$TAG/docs/changelog.md)."
            echo
            echo "Distributions attached:"
            for file in dist-pantr/* dist-pantr-mpi/*; do echo "- \`$(basename "$file")\`"; done
          } > release-notes.md
          cat release-notes.md

      - name: Keep the Release notes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: dist-pantr
          path: dist-pantr/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: dist-pantr-mpi
          path: dist-pantr-mpi/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI (rehearsal)
    needs: [collect]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pantr/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: .

      - name: Publish to TestPyPI
        # Pinned to the release/v1 commit SHA (third-party action handling an OIDC
        # token that can publish to PyPI). Bump deliberately; @release/v1 is mutable.
        #
        # This pin has to keep up with the core metadata version the build emits. The
        # action verifies the distributions with the twine it ships, and twine rejects a
        # metadata version its `packaging` does not know: the 2026-02-18 pin carried
        # twine 6.1.0 / packaging 25.0, which know up to 2.4, so it refused a wheel built
        # by hatchling 1.32.0 (the backend then) with `InvalidDistribution: '2.5' is not a
        # valid metadata version`. The wheels now come from scikit-build-core and carry
        # Metadata-Version 2.4; v1.14.2 ships twine 7.0.0 / packaging 26.2.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 @ 2026-07-29
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-pantr/
          # Re-running a tag (or a dispatch on the same version) must not fail
          # because the files already exist on TestPyPI.
          skip-existing: true

      - name: Publish pantr-mpi to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 @ 2026-07-29
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-pantr-mpi/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [testpypi]
    # Only real tag pushes reach the production index; dispatch stops at TestPyPI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pantr/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: .

      - name: Publish to PyPI
        # Pinned to the release/v1 commit SHA; see the TestPyPI step above.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 @ 2026-07-29
        with:
          packages-dir: dist-pantr/
          # A re-run after a failed pantr-mpi upload must get past the files already up.
          skip-existing: true

      - name: Publish pantr-mpi to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 @ 2026-07-29
        with:
          packages-dir: dist-pantr-mpi/
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: .

      - name: Download the Release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run after the release already exists uploads/refreshes
          # assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing assets."
            gh release upload "$TAG" dist-pantr/* dist-pantr-mpi/* --clobber
          else
            gh release create "$TAG" dist-pantr/* dist-pantr-mpi/* \
              --title "$TAG" \
              --verify-tag \
              --notes-file release-notes.md
          fi
