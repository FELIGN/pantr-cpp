# Throwaway diagnostic: which part of the MSVC /arch:AVX512 build does not finish.
name: diag-msvc-avx512
on:
  push:
    branches: [diag/msvc-avx512]
jobs:
  probe:
    name: "${{ matrix.case }}"
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case: [eigen-lu-avx512-O2-undef, ext-v4-change_basis-dontvec]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Dependencies
        shell: bash
        run: |
          python tools/requirements.py build > requirements.txt
          python -m pip install -r requirements.txt "cmake>=3.28" ninja
      - name: Configure as CI's extension leg
        shell: bash
        run: |
          cmake -S . -B build/msvc-ext -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DPANTR_BUILD_PYTHON=ON -DPANTR_BUILD_TESTS=OFF -DPANTR_INSTALL=OFF \
            -DPANTR_NATIVE_ARCH=OFF -DPANTR_MULTI_ISA=ON -DPANTR_BUILD_PYTHON_TEST_MODULES=ON \
            -DPANTR_WARNINGS_AS_ERRORS=ON ${{ matrix.case == 'ext-v4-change_basis-dontvec' && '-DCMAKE_CXX_FLAGS=-DEIGEN_DONT_VECTORIZE' || '' }}
      - name: Run the case (25 min cap)
        shell: bash
        run: |
          set +e
          export MSYS_NO_PATHCONV=1
          E=build/msvc-ext/_deps/pantr_eigen-src
          case "${{ matrix.case }}" in
            ext-v4-change_basis) cmd=(ninja -C build/msvc-ext -v bindings/CMakeFiles/_pantr_v4.dir/src/change_basis.cpp.obj) ;;
            ext-v3-change_basis) cmd=(ninja -C build/msvc-ext -v bindings/CMakeFiles/_pantr_v3.dir/src/change_basis.cpp.obj) ;;
            eigen-lu-avx512-O2)  cmd=(cl -nologo -c -std:c++20 -EHsc -O2 -arch:AVX512 -Bt+ "-I$E" diag/probe.cpp) ;;
            eigen-lu-avx512-Od)  cmd=(cl -nologo -c -std:c++20 -EHsc -Od -arch:AVX512 -Bt+ "-I$E" diag/probe.cpp) ;;
            eigen-lu-avx2-O2)    cmd=(cl -nologo -c -std:c++20 -EHsc -O2 -arch:AVX2 -Bt+ "-I$E" diag/probe.cpp) ;;
            eigen-nolu-avx512-O2) cmd=(cl -nologo -c -std:c++20 -EHsc -O2 -arch:AVX512 -Bt+ -DPROBE_NO_LU "-I$E" diag/probe.cpp) ;;
            eigen-lu-avx512-O2-dontvec) cmd=(cl -nologo -c -std:c++20 -EHsc -O2 -arch:AVX512 -Bt+ -DEIGEN_DONT_VECTORIZE "-I$E" diag/probe.cpp) ;;
            eigen-lu-avx512-O2-Ob1) cmd=(cl -nologo -c -std:c++20 -EHsc -O2 -Ob1 -arch:AVX512 -Bt+ "-I$E" diag/probe.cpp) ;;
            eigen-lu-avx512-O2-undef) cmd=(cl -nologo -c -std:c++20 -EHsc -O2 -arch:AVX512 -Bt+ -U__AVX512F__ -U__AVX512CD__ -U__AVX512BW__ -U__AVX512DQ__ -U__AVX512VL__ "-I$E" diag/probe.cpp) ;;
            ext-v4-change_basis-dontvec) cmd=(ninja -C build/msvc-ext -v bindings/CMakeFiles/_pantr_v4.dir/src/change_basis.cpp.obj) ;;
          esac
          t0=$(date +%s)
          timeout 1500 "${cmd[@]}"
          rc=$?
          echo "RESULT case=${{ matrix.case }} rc=$rc seconds=$(( $(date +%s) - t0 )) (rc 124 = timed out)"
          exit 0
