[build-system]
# Both pinned exactly. nanobind's pin is the one every pantr extension module builds against
# (_pantr here; _pantr_mpi and _pantr_berf in their own distributions): modules that exchange
# nanobind objects must share its ABI, and bindings/CMakeLists.txt refuses any other version.
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pantr"
description = "Polynomial And NURBS Toolkit"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Antolin", email = "pablo.antolin@epfl.ch" }]
keywords = [
  "nurbs",
  "b-spline",
  "bezier",
  "bernstein",
  "spline",
  "isogeometric-analysis",
  "cad",
  "geometric-modeling",
  "quadrature",
  "scientific-computing",
]
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
# Always-on runtime dependencies. Optional features (MPI, METIS partitioning,
# visualization) live in `[project.optional-dependencies]` and are opt-in. Numba and
# threadpoolctl stay until the last stage of the C++ port removes the last kernel using them.
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.15,<2",  # 1.15 added BarycentricInterpolator's `rng`, which Lagrange tabulation needs to be reproducible
  "numba>=0.63,<0.66",  # 0.66.0 broke mypy's view of get_num_threads/config.NUMBA_NUM_THREADS
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
mpi = [
  "mpi4py>=3.1,<5",
]
metis = [
  "pymetis>=2025.2",
]
viz = [
  "pyvista>=0.43,<1",
]
docs = [
  "sphinx>=7.2,<8",
  "furo>=2024.1",
  "myst-parser>=2.0,<3",
  "linkify-it-py>=2.0,<3",
  # matplotlib is used only by the 2-D plots in the tutorial scripts (not by pantr
  # itself, whose rendering is pyvista-based); pinned here so the gallery always builds.
  "matplotlib>=3.7,<4",
  # Sphinx-Gallery executes the `tutorials/` scripts and embeds their output; pyvista
  # renders the 3-D scenes off-screen and the trame stack (+ nest_asyncio2)
  # exports them as interactive vtk.js widgets. On headless builders docs/conf.py
  # starts Xvfb and VTK renders via Mesa software GL (RTD installs them through
  # `.readthedocs.yaml`; GitHub's ubuntu-latest ships them).
  "sphinx-gallery>=0.15,<1",
  "sphinx-design>=0.5,<1",
  # Bibliographic citations ({cite} roles + the References page bibliography).
  # Pinned <2.7: 2.7+ requires Sphinx >=8, but the docs toolchain is pinned to Sphinx 7.
  "sphinxcontrib-bibtex>=2.6,<2.7",
  "pantr[viz]",
  "trame>=3,<4",
  "trame-vtk>=2,<3",
  "trame-vuetify>=2,<4",
  "nest-asyncio2>=1,<2",
]
# `dev` pulls in every optional feature extra so a single
# `pip install -e ".[dev]"` yields a complete contributor environment and CI runs
# the full suite (no silently skipped viz/MPI/METIS tests).
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4,<6",
  "pytest-xdist>=3,<4",
  "mypy>=1.10,<2",
  "ruff>=0.12.0,<0.13",
  # Pinned exactly: clang-format's output changes between major versions, and CI checks the
  # C++ sources against this one (`clang-format --dry-run --Werror`).
  "clang-format==18.1.8",
  "pre-commit>=3.6,<4",
  "import-linter>=2.0,<3",
  "pantr[mpi]",
  "pantr[metis]",
  "pantr[viz]",
  "pantr[docs]",
]

[project.urls]
Homepage = "https://github.com/FELIGN/pantr"
Documentation = "https://pantr.readthedocs.io"
Source = "https://github.com/FELIGN/pantr"
Issues = "https://github.com/FELIGN/pantr/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
# The version's single source is `__version__` in the package __init__ (CMakeLists.txt checks
# that include/pantr/version.hpp agrees).
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/pantr/__init__.py"
metadata.version.regex = '^__version__[^=]*=\s*"(?P<value>[^"]+)"'
# One cp312-abi3 wheel per platform serves every CPython >= 3.12 (nanobind STABLE_ABI; the CMake
# side asks for Python's SABIModule component when PANTR_STABLE_ABI is ON).
wheel.py-api = "cp312"
wheel.packages = ["src/pantr"]
# Only the extension modules: pantr's headers and CMake package install from a CMake build, and the
# test-only modules (component `testing`) never ship.
install.components = ["python"]
# scikit-build-core strips at install by default; keep the symbols, and with NOMINSIZE in the CMake
# the -O3 the release build asks for (design/packaging.md).
install.strip = false
build-dir = "build/skbuild/{wheel_tag}"
sdist.exclude = [".claude", "benchmarks/results"]

[tool.scikit-build.cmake]
build-type = "Release"
version = ">=3.28"

[tool.scikit-build.cmake.define]
PANTR_BUILD_PYTHON = "ON"
PANTR_BUILD_TESTS = "OFF"
PANTR_INSTALL = "OFF"
PANTR_NATIVE_ARCH = "OFF"
PANTR_STABLE_ABI = "ON"
PANTR_MULTI_ISA = "ON"

[tool.cibuildwheel]
# One cp312-abi3 wheel per platform (R8: Linux x86_64 and aarch64, macOS arm64, Windows amd64),
# built by CI leg 11. No musllinux, no 32-bit Windows (the x86-64 rungs have no 32-bit target).
build = ["cp312-*"]
skip = ["*-musllinux_*", "*-win32"]
build-verbosity = 1
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# The suite against the installed wheel, once per rung the runner executes (tools/wheel_test.py
# sets PANTR_TEST_INSTALLED=1 and empties pytest.ini's pythonpath, so the checkout's src is never
# imported).
test-requires = ["pytest>=7.4,<9", "pytest-xdist>=3,<4"]
test-command = "python {project}/tools/wheel_test.py {project} -n 4"

[tool.cibuildwheel.macos]
# Floating-point std::to_chars needs macOS 13.4 (design DR-8).
environment = { MACOSX_DEPLOYMENT_TARGET = "13.4" }

[tool.importlinter]
root_package = "pantr"

[[tool.importlinter.contracts]]
name = "Serial core must not import pantr.mpi"
type = "forbidden"
source_modules = [
  "pantr.basis",
  "pantr.bezier",
  "pantr.bspline",
  "pantr.cad",
  "pantr.change_basis",
  "pantr.geometry",
  "pantr.grid",
  "pantr.quad",
  "pantr.tolerance",
  "pantr.transform",
  "pantr.viz",
]
forbidden_modules = ["pantr.mpi"]
